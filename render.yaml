services:
  - type: web
    name: jerry-assistant-web
    runtime: node
    plan: free
    region: singapore
    branch: codex
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: auto
      - key: ONLINE_AI_BASE_URL
        sync: false
